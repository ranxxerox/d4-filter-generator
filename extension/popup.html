<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D4 Filter Generator</title>
<style>
  :root { --bg:#0a0a0c; --bg2:#111114; --border:#2a2a32; --text:#e8e4da; --gold:#c9a84c; --text2:#9a9590; }
  body { width: 420px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 14px; }
  h1 { font-size: 15px; color: var(--gold); margin: 0 0 10px; letter-spacing: 0.05em; text-transform: uppercase; }
  button { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; cursor: pointer; width: 100%; }
  button.primary { border-color: var(--gold); color: var(--gold); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 10px 0 0; color: var(--text2); font-size: 12px; min-height: 18px; }
  #summary { margin-top: 10px; font-size: 12px; color: var(--text2); white-space: pre-wrap; }
  #code { margin-top: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: 11px monospace; color: var(--gold); word-break: break-all; max-height: 140px; overflow-y: auto; display: none; }
  #copy { margin-top: 8px; display: none; }
  label { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; font-size: 12px; color: var(--text2); }
  select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
</style>
</head>
<body>
  <h1>D4 Filter Generator</h1>
  <label>Gold tier needs
    <select id="gold">
      <option value="1">1+</option>
      <option value="2" selected>2+</option>
      <option value="3">3+</option>
    </select>
    core stats
  </label>
  <label>Variant
    <select id="variant"></select>
  </label>
  <button class="primary" id="generate">Generate from this tab</button>
  <div id="status"></div>
  <div id="summary"></div>
  <div id="code"></div>
  <button id="copy">Copy Code</button>
  <script src="lib/core.js"></script>
  <script src="lib/tiers.js"></script>
  <script src="lib/guide-spec.js"></script>
  <script src="lib/mapper.js"></script>
  <script src="lib/guide-tab.js"></script>
  <script src="popup.js"></script>
</body>
</html>
