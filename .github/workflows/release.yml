name: Release extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the extension version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: publishing v$version from $GITHUB_SHA."
            exit 0
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match extension/manifest.json version $version."
            exit 1
          fi

      - name: Package the extension
        run: zip -r d4-filter-generator-extension.zip extension -x 'extension/*.md'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          target=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            target="--target $SHA"
          fi
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" d4-filter-generator-extension.zip \
            --title "D4 Filter Generator extension $VERSION" \
            --notes-file .github/release-notes.md \
            $target $prerelease
